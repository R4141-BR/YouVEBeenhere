<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset = "UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>We Meet Again</title>
</head>
<body>

<style>
    body {
        background-image: url('fundo2.png');
        background-size: 100% 100%;
        background-repeat: no-repeat;
        margin:0;
        min-height: 100vh;
        color: #ffffff;
    }

    .centralizar {
        position:absolute;
        top:50%;
        left:50%;
        transform: translate(-50%, -50%);
        text-align: center;
        color:#ffffff;
    }

    .sword {
        position: absolute;
        top: 65%;
        left: 45%;
        transform: translate(-50%, -50%);
        transform: scale(1.2);  
    }
    .oldman {
        position: absolute;
        top: 85%;
        left: 50%;
        transform: translateX(-50%);
    }
    .door {
        position: absolute;
        top: 10%;
        left: 45%;
        transform: translateX(-50%);
        transform: scale(0.8);
    }
</style>
<div class="centralizar">
    <h1>It's Dangerous to go Alone! Choose your path!</h1>
</div>

<div class="sword">
    <a href="" class="sword"><img src="sword.png" alt="Sword"></a>
</div>

<div class="door">
    <a href="chooseyourpath.html" class="door"><img src="door-1.png" alt="Door"></a>
</div>

<div class="oldman">
    <a href="whoami.html" class="oldman"><button>Pick the Old Man</button></a>
</div>

</body>
</html>
